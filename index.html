<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON Mobile Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .arc-glow {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.6), inset 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .pulsing {
            animation: pulse 1.5s infinite ease-in-out;
        }
        .listening-glow {
            box-shadow: 0 0 40px rgba(234, 179, 8, 0.6);
            border-color: rgba(234, 179, 8, 0.8) !important;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 30px rgba(6, 182, 212, 0.6); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 50px rgba(6, 182, 212, 0.9); }
        }
    </style>
</head>
<body class="bg-slate-950 text-cyan-400 font-sans min-h-screen flex flex-col justify-between p-6 overflow-hidden">

    <!-- Top HUD -->
    <div class="flex justify-between items-center text-xs tracking-widest uppercase border-b border-cyan-900/50 pb-3">
        <div>CORE_SYSTEM: <span class="text-emerald-400 font-bold">AXON_v1.2</span></div>
        <div id="status-hud" class="text-amber-400">SLEEP_MODE</div>
    </div>

    <!-- Center Stage -->
    <div class="flex flex-col items-center justify-center my-auto gap-8">
        <div id="arc-reactor" class="w-44 h-44 rounded-full border-4 border-cyan-400/30 flex items-center justify-center arc-glow bg-slate-900 transition-all duration-300 cursor-pointer">
            <div class="w-36 h-36 rounded-full border-2 border-dashed border-cyan-400/50 flex items-center justify-center animate-[spin_30s_linear_infinite]">
                <div class="w-24 h-24 rounded-full bg-cyan-500/10 border border-cyan-400 flex items-center justify-center">
                    <span id="status-text" class="text-xs font-bold tracking-wider uppercase text-cyan-200 text-center px-2">Tap to Initialize</span>
                </div>
            </div>
        </div>

        <!-- Terminal Output -->
        <div class="w-full max-w-md bg-slate-900/80 border border-cyan-800/40 rounded-lg p-4 h-36 flex flex-col justify-end gap-2 text-sm backdrop-blur-sm">
            <div class="text-cyan-600/70 select-none">// SYSTEM MONITOR</div>
            <div id="user-transcript" class="text-slate-400 italic min-h-[20px]">System offline. Tap the reactor.</div>
            <div id="jarvis-response" class="text-cyan-300 font-medium min-h-[20px] border-t border-cyan-900/30 pt-2">"Waiting for authorization..."</div>
        </div>
    </div>

    <!-- Footer Diagnostics -->
    <div class="w-full max-w-md mx-auto text-center text-[10px] tracking-widest text-cyan-700 uppercase">
        Wake Word: Say <span class="text-cyan-400 font-bold">"Axon"</span> anywhere in your sentence.
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isSystemActive = false; 
        let isSpeaking = false;

        const arcReactor = document.getElementById('arc-reactor');
        const statusText = document.getElementById('status-text');
        const statusHud = document.getElementById('status-hud');
        const userTranscript = document.getElementById('user-transcript');
        const jarvisResponse = document.getElementById('jarvis-response');

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            // Continuous is key: keep listening in the background
            recognition.continuous = true; 
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isSystemActive = true;
                statusHud.innerText = "LISTENING...";
                statusHud.className = "text-emerald-400 font-bold";
                statusText.innerText = "Say 'Axon'";
                userTranscript.innerText = "Listening for wake word...";
                arcReactor.classList.add('pulsing');
            };

            recognition.onend = () => {
                // If system shouldn't be off, auto-restart mic (fixes mobile timeouts)
                if (isSystemActive && !isSpeaking) {
                    recognition.start();
                } else if (!isSpeaking) {
                    setSleepState();
                }
            };

            recognition.onresult = (event) => {
                const lastResultIndex = event.results.length - 1;
                const transcript = event.results[lastResultIndex][0].transcript.trim();
                const lowerTranscript = transcript.toLowerCase();
                
                userTranscript.innerText = `Heard: "${transcript}"`;

                // WAKE WORD CHECK: Does the sentence contain "axon" or "action"? 
                // (Added 'action' as speech engines sometimes mishear 'axon')
                if (lowerTranscript.includes('axon') || lowerTranscript.includes('action')) {
                    
                    // Visual feedback that Axon woke up
                    arcReactor.classList.add('listening-glow');
                    statusText.innerText = "Processing...";
                    
                    // Clean the text to see what command came after the name
                    processAxonCommand(lowerTranscript);
                }
            };

            recognition.onerror = (err) => {
                console.error("Speech Error:", err.error);
                // Auto-restart on network dropouts
                if (err.error === 'network') {
                    setTimeout(() => { if(isSystemActive) recognition.start(); }, 1000);
                }
            };
        } else {
            statusText.innerText = "Unsupported";
            jarvisResponse.innerText = "Speech API not available on this device.";
        }

        // Tap to Boot/Shutdown system
        arcReactor.addEventListener('click', () => {
            if (!recognition) return;

            if (!isSystemActive) {
                // Unlocks audio layer on iOS/Android
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
                recognition.start();
                speak("Core systems online. Axon matrix initialized. Standing by, sir.");
            } else {
                isSystemActive = false;
                recognition.stop();
                window.speechSynthesis.cancel();
                setSleepState();
            }
        });

        function setSleepState() {
            statusHud.innerText = "SLEEP_MODE";
            statusHud.className = "text-amber-400";
            statusText.innerText = "Tap to Wake";
            arcReactor.classList.remove('pulsing', 'listening-glow');
        }

        // Command Processing Array
        function processAxonCommand(fullSpeech) {
            let reply = "Yes sir? I heard my name, but I couldn't isolate a clean instruction matrix.";

            if (fullSpeech.includes('hello') || fullSpeech.includes('wake up')) {
                reply = "Online and ready, sir. What are your coordinates today?";
            } else if (fullSpeech.includes('time')) {
                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                reply = `The time is exactly ${time}, sir.`;
            } else if (fullSpeech.includes('status') || fullSpeech.includes('diagnostic')) {
                reply = "All links operational. Battery power stabilized. System environment is optimal.";
            } else if (fullSpeech.includes('open youtube')) {
                reply = "Directing network protocols to YouTube.";
                window.open('https://www.youtube.com', '_blank');
            } else if (fullSpeech.includes('clear')) {
                reply = "Clearing screen buffer.";
                userTranscript.innerText = "Awaiting input...";
            }

            speak(reply);
        }

        // Voice output mechanics
        function speak(text) {
            isSpeaking = true;
            
            // Turn off mic temporarily so Axon doesn't loop hearing its own voice
            if (isSystemActive) recognition.stop();

            jarvisResponse.innerText = `AXON: "${text}"`;
            const speech = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            const sharpVoice = voices.find(v => v.name.includes('Google UK English Male') || v.lang.startsWith('en-GB'));
            if (sharpVoice) speech.voice = sharpVoice;
            
            speech.rate = 1.05;
            speech.pitch = 0.95;

            speech.onend = () => {
                isSpeaking = false;
                arcReactor.classList.remove('listening-glow');
                statusText.innerText = "Say 'Axon'";
                // Re-arm the background ears
                if (isSystemActive) recognition.start();
            };

            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
